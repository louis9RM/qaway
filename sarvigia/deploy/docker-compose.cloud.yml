# Qaway — despliegue en la NUBE (Oracle/VPS), sin GPU: el LLM es Gemini API.
# Uso en la VM:
#   cd sarvigia/deploy
#   cp .env.example .env   &&   nano .env     # pega tu GEMINI_API_KEY
#   docker compose -f docker-compose.cloud.yml up -d --build
services:
  frontend:
    image: nginx:1.27-alpine
    container_name: qaway-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:8101"      # lo publica cloudflared
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    build: ../backend
    image: qaway/backend
    container_name: qaway-backend
    restart: unless-stopped
    working_dir: /app/sarvigia/backend
    command: uvicorn app:app --host 0.0.0.0 --port 8100
    ports:
      - "127.0.0.1:8100:8100"      # solo local (debug)
    volumes:
      - ..:/app/sarvigia           # código + data (caché de escenas en vivo)
    environment:
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QAWAY_GEMINI_MODEL=${QAWAY_GEMINI_MODEL:-gemini-3.5-flash}
      - QAWAY_GEMINI_FALLBACKS=${QAWAY_GEMINI_FALLBACKS:-gemini-3.1-flash-lite,gemini-3.6-flash}
      - QAWAY_CACHE_MAX_GB=${QAWAY_CACHE_MAX_GB:-50}
