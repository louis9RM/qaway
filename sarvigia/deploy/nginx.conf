# SARvigía — nginx del frontend (servido por cloudflared en 127.0.0.1:8101)
server {
    listen 8101;
    server_name sarvigia.thecreatorcampus.ai;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Cloudflare pasa la IP real del visitante
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Evitar caché agresivo de HTML/JS/CSS (para que las actualizaciones se vean al instante)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Backend SARvigía (orquestador: búsqueda + descarga NISAR)
    location /api/ {
        proxy_pass http://backend:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
