# SARvigía — despliegue (frontend + backend), aislado; no toca los cursos
# Uso:  cd sarvigia/deploy && docker compose up -d --build
services:
  frontend:
    image: nginx:1.27-alpine
    container_name: sarvigia-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:8101"      # lo publica cloudflared
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    build: ../backend
    image: sarvigia/backend
    container_name: sarvigia-backend
    restart: unless-stopped
    working_dir: /app/sarvigia/backend
    command: uvicorn app:app --host 0.0.0.0 --port 8100
    ports:
      - "127.0.0.1:8100:8100"      # solo local (debug); el frontend lo alcanza por red interna
    volumes:
      - ..:/app/sarvigia           # módulo de datos + config/secrets + data (escritura)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # para alcanzar Ollama en el host
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - QAWAY_LLM_MODEL=qwen2.5:7b
      - QAWAY_CACHE_MAX_GB=100
